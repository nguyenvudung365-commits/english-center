# Optional overlay: docker compose -f compose.yaml -f compose.web.yaml up -d --build
services:
  web:
    image: english-center-web:${IMAGE_TAG:-local}
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    depends_on:
      api:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
