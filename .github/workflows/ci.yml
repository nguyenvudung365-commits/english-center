name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Cài .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Khôi phục thư viện
        run: dotnet restore EnglishCenter.sln
      - name: Biên dịch
        run: dotnet build EnglishCenter.sln -c Release --no-restore
      - name: Chạy kiểm thử
        run: dotnet test EnglishCenter.sln -c Release --no-build --logger trx --results-directory TestResults
      - name: Lưu kết quả kiểm thử
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-kiem-thu
          path: TestResults/**/*.trx
          if-no-files-found: warn
  container-smoke:
    name: container-smoke
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Build image và kiểm tra PostgreSQL, Identity, MinIO
        run: bash scripts/ci-smoke.sh
